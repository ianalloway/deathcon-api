services:
  - type: web
    name: deathcon-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEATHCON_OPERATOR_TOKEN
        sync: false
      - key: DEATHCON_WEBHOOK_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
